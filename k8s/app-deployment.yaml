apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-flask
  labels:
    app: asr-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asr-flask
  template:
    metadata:
      labels:
        app: asr-flask
    spec:
      containers:
      - name: asr-flask
        # registry.k8s.io/hpa-example se sustituye por la URI de tu imagen al aplicar (ver README)
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 8080
        env:
        # En vez de la IP de la VM de Redis, usamos el nombre del Service
        - name: REDIS_IP_GCP
          value: "redis"
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
